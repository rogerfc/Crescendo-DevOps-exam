name: Terraform PR Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: fmt / validate / plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.15"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: true

      - name: Write plan to job summary
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
          OUTCOME: ${{ steps.plan.outcome }}
        run: |
          echo "### Terraform Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$OUTCOME" == "success" ]]; then
            echo "**Result: ✅ success**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Result: ❌ failure**" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '<details><summary>Show Plan</summary>' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```hcl' >> "$GITHUB_STEP_SUMMARY"
          echo "$PLAN" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

      - name: Post plan comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            const outcome = '${{ steps.plan.outcome }}';
            const badge  = outcome === 'success' ? '✅ success' : '❌ failure';
            const plan   = `${{ steps.plan.outputs.stdout }}`;

            const body = [
              `#### Terraform Plan: ${badge}`,
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```hcl',
              plan.length > 60000 ? plan.slice(0, 60000) + '\n\n... (truncated)' : plan,
              '```',
              '',
              '</details>',
              '',
              `*Workflow: \`${{ github.workflow }}\` | Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
